# Role — grants the queue manager ServiceAccount the minimum permissions
# needed by the PDB sidecar / MQ_ENABLE_READY_REPLICAS feature:
#
#   • patch pods — to toggle the mq.ibm.com/status label (initializing → active)
#     so that PDB-selector services route traffic only to the active replica.
#
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: "{{ include "ibm-mq.fullname" . }}-pdb"
  labels:
{{- include "ibm-mq.labels" . | nindent 4 }}
rules:
  # Required to patch the mq.ibm.com/status label on the Pod itself
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["patch"]
    resourceNames:
      {{- include "ibm-mq.pdb.podResourceNames" . | nindent 6 }}
{{- end }}
