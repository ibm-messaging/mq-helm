license: accept
queueManager:
  nativeha:
    enable: true
    tls:
      secretName: helmsecure
  mqscConfigMaps:
    - name: helmsecure
      items:
        - mq.mqsc
  qminiConfigMaps:
    - name: helmsecure
      items:
        - mq.ini
  podDisruptionBudget:
    enable: true
    maxUnavailable: 1
persistence:
  qmPVC:
    enable: true
pki:
  keys:
    - name: default
      secret:
        secretName: helmsecure
        items:
          - tls.key
          - tls.crt
  trust:
    - name: default
      secret:
        secretName: helmsecure
        items:
          - app.crt
metadata:
  annotations:
    productName: "IBM MQ Advanced for Developers"
    productID: "2f886a3eefbe4ccb89b2adb97c78b9cb"
    productChargedContainers: "qmgr"
    productMetric: "FREE"
# When PodDisruptionBudget is enabled, helm will initially configure the
# annotations to the values in 'license_when_replica_or_standby' below. At
# runtime the label-applying sidecar container will apply the appropriate
# set as annotations depending upon whether the NativeHA or MultiInstance qmgr pod is
# the Active (annotations) or a Replica/Standby (license_when_replica_or_standby).
  license_when_replica_or_standby:
    productName: "IBM MQ Advanced for Developers"
    productID: "2f886a3eefbe4ccb89b2adb97c78b9cb"
    productChargedContainers: "qmgr"
    productMetric: "FREE"
#
# If you are licensing for IBM MQ Advanced (with PDB), then you will need
# the following sets of annotations for initialisation, standby and active
#  annotations:
#    productName: "IBM MQ Advanced"
#    productID: "208423bb063c43288328b1d788745b0c"
#    productChargedContainers: "qmgr"
#    productMetric: "VIRTUAL_PROCESSOR_CORE"
#  license_when_replica_or_standby:
#    productName: "IBM MQ Native HA Replica"
#    productID: "0d8c5097de514a3db4d8cb3b140a7957"
#    productChargedContainers: "qmgr"
#    productMetric: "FREE"
#
route:
  openShiftRoute:
    webconsole: true
    mqtraffic: true
